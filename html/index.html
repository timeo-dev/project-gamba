<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>GAMBA</title>

    <!-- CSS verbinden -->
    <link rel="stylesheet" href="../style/style.css">
</head>

<body>

    <!-- =========================
         OBERER BEREICH
    ========================== -->
    <header>

        <!-- LOGO -->
        <div class="logo">
            <img src="../images/logo.png" alt="GAMBA Logo">
        </div>

        <!-- WALLET -->
        <div class="wallet">
            Wallet:
            <span id="wallet">1000</span> Coins
        </div>

        <!-- KONTO UND SETTINGS -->
        <div class="account">
            <button id="accountButton">Konto</button>
            <button id="settingsButton">Settings</button>
        </div>

    </header>


    <!-- =========================
         HAUPTBEREICH
    ========================== -->
    <main>

        <!-- SPIELAUSWAHL LINKS -->
        <nav class="games">

            <button id="wheelGameButton">
                Glücksrad
            </button>

            <button id="diceGameButton">
                Würfelspiel
            </button>

        </nav>


        <!-- =========================
             SPIELBEREICH
        ========================== -->
        <section class="game-area">

            <!-- GEWINN / VERLUST -->
            <div class="profit">

                Aktueller Gewinn/Verlust

                <br>

                <span id="profit">0</span> Coins

            </div>


            <!-- =========================
                 GLÜCKSRAD
            ========================== -->
            <div id="wheelGame">

                <div class="game-content">


                    <!-- GLÜCKSRAD -->
                    <div class="wheel-container">

                        <div class="pointer">
                            ▼
                        </div>

                        <div class="wheel" id="wheel">

                            <div class="wheel-center">
                                GAMBA
                            </div>

                        </div>

                    </div>


                    <!-- WETTBEREICH -->
                    <div class="bet-area">

                        <p>Wettbetrag</p>

                        <h2>
                            <span id="bet">10</span> Coins
                        </h2>


                        <!-- PLUS UND MINUS -->
                        <div class="bet-buttons">

                            <button id="minusButton">
                                −
                            </button>

                            <button id="plusButton">
                                +
                            </button>

                        </div>


                        <!-- LETZTER GEWINN -->
                        <div class="last-win">

                            Letzter Gewinn

                            <br><br>

                            <span id="lastWin">
                                0
                            </span>

                            Coins

                        </div>

                    </div>

                </div>


                <!-- PLAY -->
                <button
                    class="play-button"
                    id="playButton">

                    Play

                </button>

            </div>


            <!-- =========================
                 WÜRFELSPIEL
            ========================== -->
            <div id="diceGame" class="hidden">

                <div class="dice-content">

                    <h2>Würfelspiel</h2>

                    <div
                        class="dice"
                        id="dice">

                        ⚀

                    </div>

                    <p>
                        1–3 = verloren
                        <br>
                        4–6 = gewonnen
                    </p>

                    <button
                        class="play-button"
                        id="diceButton">

                        Würfeln

                    </button>

                </div>

            </div>

        </section>

    </main>


    <!-- =========================
         JAVASCRIPT VERBINDEN
    ========================== -->

    <script src="../script/script.js"></script>

</body>

</html>
