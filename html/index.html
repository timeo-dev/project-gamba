<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>GAMBA</title>

    <link rel="stylesheet" href="../style/style.css">
</head>


<body>

    <!-- OBERER BEREICH -->
    <header>

        <div class="logo">
        <img src="../Logo GAMGA.png" alt="GAMBA Logo">
        </div>

        <div class="wallet">
            Wallet
        </div>

        <div class="account">
            <button>Konto</button>
            <button>Settings</button>
        </div>

    </header>


    <!-- HAUPTBEREICH -->
    <main>

        <!-- LINKE SPIELAUSWAHL -->
        <nav class="games">

            <button>Glücksrad</button>
            <button>Spiel 2</button>
            <button>Spiel 3</button>
            <button>Spiel 4</button>
            <button>Spiel 5</button>

        </nav>


        <!-- SPIELBEREICH -->
        <section class="game-area">

            <div class="profit">
                Aktueller Gewinn/Verlust
            </div>


            <div class="game-content">

                <!-- GLÜCKSRAD -->
                <div class="wheel">
                    Glücksrad
                </div>


                <!-- RECHTE SEITE -->
                <div class="bet-area">

                    <p>Wettbetrag</p>

                    <div>
                        <button>+</button>
                        <button>-</button>
                    </div>

                    <div class="last-win">
                        Letzter<br>
                        Gewinn
                    </div>

                </div>

            </div>


            <button class="play-button">
                Play
            </button>

        </section>

    </main>

</body>

</html>
